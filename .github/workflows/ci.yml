name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test updater and upstream-version checks
        run: node --test tests/update-pb.test.mjs tests/check-pb-version.test.mjs
      - name: Check pinned PocketBase release is current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pb-version.mjs
      - name: Replay patches against upstream PocketBase
        run: |
          set -euo pipefail
          version=$(sed -n 's/^VERSION="${1:-\([^}]*\)}"/\1/p' scripts/update-pb.sh)
          git clone --depth 1 --branch "$version" https://github.com/pocketbase/pocketbase.git /tmp/pb
          cd /tmp/pb
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            echo "  applying $(basename "$patch")"
            git apply --check "$patch"
            git apply "$patch"
          done
          echo "All $(ls "$GITHUB_WORKSPACE"/patches/*.patch | wc -l | tr -d ' ') patches applied cleanly"

  build:
    runs-on: ubuntu-latest
    needs: patch-replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize patched PocketBase
        run: ./scripts/update-pb.sh
      - name: Test Go/JS Promise bridge
        run: GOOS=js GOARCH=wasm go test -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./adapter/internal/jsutil
      - name: Build
        run: make build

# The credential-free deploy dry-run now runs in compatibility.yml as part of
# make proof. Do not restore the token-gated duplicate build/dry-run job here.
