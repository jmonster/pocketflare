name = "pocketflare"
main = "dist/worker.mjs"
compatibility_date = "2025-05-30"

[vars]
POCKETFLARE_APP_URL = "https://pocketflare.garage.workers.dev"

# Optional: enable server-side R2 CopyObject.
# When unset, file copies stream through the Worker with bounded memory.
# When all three values are set, copies happen inside R2 with zero Worker data transfer.
#
# Create an R2 API token (Object Read & Write on STORAGE and BACKUPS) at:
#   https://dash.cloudflare.com/<your-account>/r2/api-tokens
# Then set:
#   pnpm exec wrangler secret put R2_ACCESS_KEY_ID
#   pnpm exec wrangler secret put R2_SECRET_ACCESS_KEY
#
# R2_ACCOUNT_ID = ""

[[d1_databases]]
binding = "APP_DB"
database_name = "pocketflare-app"
database_id = "57bf4f7d-ff45-45b6-a110-b68877326067"

[[d1_databases]]
binding = "LOGS_DB"
database_name = "pocketflare-logs"
database_id = "ad0c39fe-356d-49b0-973a-7fa79028d3d5"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "pocketflare-storage"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "pocketflare-backups"

[assets]
directory = "./admin-ui"
binding = "ASSETS"

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "REALTIME_DO"
class_name = "RealtimeDO"

[[migrations]]
tag = "v1"
new_classes = ["RealtimeDO"]
