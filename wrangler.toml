name = "pocketflare"
main = "dist/worker.mjs"
compatibility_date = "2025-05-30"

[vars]
POCKETFLARE_APP_URL = "https://pocketflare.garage.workers.dev"
# POCKETFLARE_DB_MODE = "d1" # default; set to "do_sqlite" for Durable Object SQLite mode

# File copies stream through the Worker with bounded memory.
# Server-side R2 S3 CopyObject is disabled after deployed Worker E2E rejected
# r2.cloudflarestorage.com fetch URLs before HTTP.

[[d1_databases]]
binding = "APP_DB"
database_name = "pocketflare-app"
database_id = "57bf4f7d-ff45-45b6-a110-b68877326067"

[[d1_databases]]
binding = "LOGS_DB"
database_name = "pocketflare-logs"
database_id = "ad0c39fe-356d-49b0-973a-7fa79028d3d5"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "pocketflare-storage"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "pocketflare-backups"

[assets]
directory = "./dist/admin-ui"
binding = "ASSETS"

[triggers]
crons = ["* * * * *"]

# ── Optional: DO SQLite mode ────────────────────────────────────────────
# Uncomment to run PocketBase inside a Durable Object backed by SQLite
# storage. Required when POCKETFLARE_DB_MODE = "do_sqlite".
#
# [[durable_objects.bindings]]
# name = "APP_DO"
# class_name = "AppDO"
#
# ── Optional: realtime/SSE via Durable Objects ─────────────────────────
# Uncomment to enable cross-isolate SSE. Without this, GET /api/realtime
# falls through to Go where SSE is non-functional on Workers (the WASM
# bridge's Flush is a no-op). ~$4/mo for a single always-warm DO instance.
#
# [[durable_objects.bindings]]
# name = "REALTIME_DO"
# class_name = "RealtimeDO"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["AppDO"]
# new_classes = ["RealtimeDO"]
